<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pathfinder</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#e4ecee;--ink:#12303a;--wall:#1f4e5a;--open:#f7fafb;--path:#ff6f4d;--pathink:#fff;--muted:#5a7780;--chip:#cfdde1;--ok:#1d8a5b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1f26;--ink:#e3eff2;--wall:#33707e;--open:#17313a;--path:#ff8a6b;--pathink:#1a1a1a;--muted:#8fb0b9;--chip:#1d3a45;--ok:#4fd195}}
:root[data-theme="dark"]{--bg:#0f1f26;--ink:#e3eff2;--wall:#33707e;--open:#17313a;--path:#ff8a6b;--pathink:#1a1a1a;--muted:#8fb0b9;--chip:#1d3a45;--ok:#4fd195}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;justify-content:center;min-height:100vh}
main{width:100%;max-width:600px;padding:20px 16px 32px}
h1{font-size:2.2rem;font-weight:800;margin:0 0 2px;letter-spacing:-.02em}
.sub{margin:0 0 18px;color:var(--muted)}
.levels{display:flex;gap:8px;margin-bottom:14px}
.levels button{flex:1;padding:10px 0;border:2px solid var(--chip);background:var(--chip);color:var(--ink);font:600 1rem inherit;font-family:inherit;border-radius:10px;cursor:pointer}
.levels button[aria-pressed="true"]{background:var(--wall);border-color:var(--wall);color:#fff}
.stats{display:flex;justify-content:space-between;font-size:.95rem;color:var(--muted);margin-bottom:10px;gap:8px;flex-wrap:wrap}
.stats b{color:var(--ink);font-weight:600}
#board{display:grid;width:100%;aspect-ratio:1;touch-action:none;user-select:none;-webkit-user-select:none;background:var(--wall);border-radius:12px;overflow:hidden;gap:0}
.c{display:flex;align-items:center;justify-content:center;font-weight:800;font-size:clamp(.6rem,3.2vw,1.1rem)}
.c.w{background:var(--wall)}
.c.o{background:var(--open);box-shadow:inset 0 0 0 .5px color-mix(in srgb,var(--ink) 10%,transparent)}
.c.p{background:var(--path);color:var(--pathink)}
.c.sol{background:color-mix(in srgb,var(--ok) 45%,var(--open))}
.c.head{box-shadow:inset 0 0 0 3px var(--ink)}
.c.cp span{width:70%;height:70%;border-radius:50%;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center}
.c.cp.done span{background:var(--ink);color:var(--open)}
.c.cp.p span{background:var(--ink);color:var(--path)}
#msg{min-height:1.6em;margin:12px 0;font-weight:600}
#msg.win{color:var(--ok)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions button{padding:10px 16px;border-radius:10px;border:2px solid var(--ink);background:transparent;color:var(--ink);font-family:inherit;font-weight:600;font-size:.95rem;cursor:pointer}
.actions button.main{background:var(--ink);color:var(--bg)}
button:focus-visible{outline:3px solid var(--path);outline-offset:2px}
</style>
</head>
<body>
<main>
<h1>Pathfinder</h1>
<p class="sub">Drag from the dot to the flag. Visit any numbered circles in order.</p>
<div class="levels" id="levels">
<button data-l="easy" aria-pressed="true">Easy</button>
<button data-l="medium" aria-pressed="false">Medium</button>
<button data-l="hard" aria-pressed="false">Difficult</button>
</div>
<div class="stats"><span>Steps <b id="steps">0</b></span><span>Time <b id="time">0:00</b></span><span>Best <b id="best">–</b></span></div>
<div id="board" role="application" aria-label="Puzzle grid"></div>
<div id="msg" aria-live="polite"></div>
<div class="actions">
<button class="main" id="new">New puzzle</button>
<button id="reset">Start over</button>
<button id="solve">Show solution</button>
</div>
</main>
<script>
const LV={easy:{n:7,loops:.04,cps:0},medium:{n:11,loops:.06,cps:2},hard:{n:17,loops:.05,cps:3}};
let level='easy',N,grid,start,goal,cps,sol,path,dragging=false,t0=null,timer=null,won=false,showSol=false;
const best={};try{Object.assign(best,JSON.parse(localStorage.getItem('pf-best')||'{}'))}catch(e){}
const $=id=>document.getElementById(id),board=$('board');

function gen(){
  const {n,loops,cps:k}=LV[level];N=n;
  grid=Array(N*N).fill(1);
  const id=(x,y)=>y*N+x,stack=[[1,1]];grid[id(1,1)]=0;
  while(stack.length){
    const [x,y]=stack[stack.length-1];
    const nb=[[2,0],[-2,0],[0,2],[0,-2]].map(([a,b])=>[x+a,y+b,x+a/2,y+b/2]).filter(([a,b])=>a>0&&b>0&&a<N-1&&b<N-1&&grid[id(a,b)]);
    if(!nb.length){stack.pop();continue}
    const [a,b,mx,my]=nb[Math.random()*nb.length|0];
    grid[id(mx,my)]=0;grid[id(a,b)]=0;stack.push([a,b]);
  }
  for(let y=1;y<N-1;y++)for(let x=1;x<N-1;x++){
    if(grid[id(x,y)]&&((x+y)%2===1)&&Math.random()<loops*3){
      const h=!grid[id(x-1,y)]&&!grid[id(x+1,y)],v=!grid[id(x,y-1)]&&!grid[id(x,y+1)];
      if(h||v)grid[id(x,y)]=0;
    }
  }
  start=id(1,1);goal=id(N-2,N-2);
  sol=bfs(start,goal);
  cps=[];
  for(let i=1;i<=k;i++)cps.push(sol[Math.round(sol.length*i/(k+1))]);
  cps=[...new Set(cps)].filter(c=>c!==start&&c!==goal);
}
function nbrs(i){const x=i%N,y=i/N|0,r=[];if(x>0)r.push(i-1);if(x<N-1)r.push(i+1);if(y>0)r.push(i-N);if(y<N-1)r.push(i+N);return r.filter(j=>!grid[j])}
function bfs(a,b){
  const prev=new Map([[a,-1]]),q=[a];
  while(q.length){const c=q.shift();if(c===b)break;for(const j of nbrs(c))if(!prev.has(j)){prev.set(j,c);q.push(j)}}
  const p=[];for(let c=b;c!==-1;c=prev.get(c))p.push(c);return p.reverse();
}
function build(){
  board.style.gridTemplateColumns=`repeat(${N},1fr)`;board.innerHTML='';
  for(let i=0;i<N*N;i++){const d=document.createElement('div');d.dataset.i=i;board.appendChild(d)}
  draw();
}
function draw(){
  const onPath=new Set(path),solSet=new Set(showSol?sol:[]);
  const reached=cpsReached();
  [...board.children].forEach((d,i)=>{
    let cls='c '+(grid[i]?'w':'o'),html='';
    if(!grid[i]){
      if(onPath.has(i))cls+=' p';else if(solSet.has(i))cls+=' sol';
      if(i===path[path.length-1])cls+=' head';
      if(i===start)html='●';
      else if(i===goal)html='⚑';
      else if(cps.includes(i)){const n=cps.indexOf(i)+1;cls+=' cp'+(n<=reached?' done':'');html=`<span>${n}</span>`}
    }
    d.className=cls;d.innerHTML=html;
  });
  $('steps').textContent=path.length-1;
  $('best').textContent=best[level]!=null?best[level]:'–';
}
function cpsReached(){let n=0;for(const c of path){if(c===cps[n])n++}return n}
function say(t,w){const m=$('msg');m.textContent=t;m.className=w?'win':''}
function step(i){
  if(won||grid[i])return;
  const last=path[path.length-1];if(i===last)return;
  const idx=path.indexOf(i);
  if(idx>=0){path=path.slice(0,idx+1)}
  else if(nbrs(last).includes(i)){path.push(i);if(!t0)startTimer()}
  else return;
  draw();check();
}
function check(){
  const last=path[path.length-1];
  if(last!==goal){say('');return}
  if(cpsReached()<cps.length){say(`Visit circle ${cpsReached()+1} before the flag.`);return}
  won=true;stopTimer();
  const s=path.length-1;
  const par=sol.length-1;
  if(best[level]==null||s<best[level]){best[level]=s;try{localStorage.setItem('pf-best',JSON.stringify(best))}catch(e){}}
  draw();
  say(s<=par?`Solved in the fewest steps (${s}). Perfect.`:`Solved in ${s} steps. The shortest route is ${par}.`,true);
}
function startTimer(){t0=Date.now();timer=setInterval(()=>{const s=(Date.now()-t0)/1000|0;$('time').textContent=(s/60|0)+':'+String(s%60).padStart(2,'0')},500)}
function stopTimer(){clearInterval(timer);timer=null}
function fresh(){
  stopTimer();t0=null;won=false;showSol=false;$('time').textContent='0:00';
  path=[start];$('solve').textContent='Show solution';
  say(cps.length?'Draw a path to the flag, visiting the circles in order.':'Draw a path from the dot to the flag.');
  draw();
}
function newPuzzle(){gen();build();fresh()}
function cellAt(e){const el=document.elementFromPoint(e.clientX,e.clientY);return el&&el.dataset&&el.dataset.i!=null&&board.contains(el)?+el.dataset.i:null}
board.addEventListener('pointerdown',e=>{
  const i=cellAt(e);if(i==null)return;
  board.setPointerCapture(e.pointerId);dragging=true;step(i);
});
board.addEventListener('pointermove',e=>{if(!dragging)return;const i=cellAt(e);if(i!=null)step(i)});
['pointerup','pointercancel'].forEach(ev=>board.addEventListener(ev,()=>dragging=false));
$('levels').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  level=b.dataset.l;[...$('levels').children].forEach(x=>x.setAttribute('aria-pressed',x===b));newPuzzle();
});
$('new').onclick=newPuzzle;
$('reset').onclick=fresh;
$('solve').onclick=()=>{showSol=!showSol;$('solve').textContent=showSol?'Hide solution':'Show solution';draw()};
window.addEventListener('keydown',e=>{
  const m={ArrowUp:-N,ArrowDown:N,ArrowLeft:-1,ArrowRight:1}[e.key];
  if(m){e.preventDefault();step(path[path.length-1]+m)}
});
newPuzzle();
</script>
</body>
</html>
